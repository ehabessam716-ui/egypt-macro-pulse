[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egypt-macro-pulse"
version = "1.0.0"
description = "Local learning tool that tracks what drives USD/EGP and Egypt's economy"
requires-python = ">=3.11"

[project.scripts]
pulse = "pulse.cli:main"

[tool.setuptools.packages.find]
include = ["pulse*"]

[tool.setuptools.package-data]
pulse = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
