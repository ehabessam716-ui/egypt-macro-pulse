# Plain-language explanations for readers (EN / Egyptian Arabic).
# what   = what the indicator is
# drivers= what usually moves it
# up/down= what a rise / fall tends to mean for the pound and the economy
# related= indicators whose moves are shown as "possible reasons from the data" (never presented as proof)
# `patterns` cover families of similar series (regex on the id). Exact ids win over patterns.

series:
  fx_cbe_official:
    what: ["How many Egyptian pounds one US dollar costs at the Central Bank's official average market rate (buy side).", "عدد الجنيهات اللي بتشتري دولار واحد بسعر البنك المركزي الرسمي (سعر الشراء)."]
    drivers: ["Supply and demand for dollars in banks: remittances, tourism, Suez fees, foreign investment and IMF/Gulf money bring dollars in; imports (especially fuel and food) and debt payments take them out.", "العرض والطلب على الدولار في البنوك: التحويلات والسياحة وقناة السويس والاستثمار الأجنبي وفلوس صندوق النقد والخليج بيدخلوا دولارات، والواردات خصوصا البترول والأكل وسداد الديون بيخرجوها."]
    up: ["A higher number means a weaker pound: imports and imported medicines cost more, which feeds inflation over the following months.", "الرقم لما يزيد يعني الجنيه ضعف: المستورد والأدوية المستوردة بتغلى، وده بيزود التضخم في الشهور الجاية."]
    down: ["A lower number means a stronger pound: imported goods get cheaper and inflation pressure eases.", "الرقم لما يقل يعني الجنيه قوي: المستورد بيرخص وضغط التضخم بيخف."]
    related: [nir, remittances_yoy, brent, fx_gold_implied, tbill_12m_yield, portfolio_net_fy]
  fx_cbe_official_sell:
    what: ["The CBE official selling rate for one US dollar (a little above the buy rate).", "سعر بيع الدولار الرسمي في البنك المركزي، أعلى شوية من سعر الشراء."]
    drivers: ["Moves together with the buy rate; the gap is the bank spread.", "بيتحرك مع سعر الشراء، والفرق بينهم هو هامش البنوك."]
    up: ["Weaker pound (see the official buy rate).", "الجنيه أضعف."]
    down: ["Stronger pound.", "الجنيه أقوى."]
    related: [fx_cbe_official]
  fx_market:
    what: ["USD/EGP as quoted on global markets (Yahoo). Unofficial, but a quick cross-check on the CBE rate.", "سعر الدولار مقابل الجنيه في الأسواق العالمية حسب ياهو. غير رسمي لكنه بيتأكد بيه السعر الرسمي."]
    drivers: ["The same dollar supply and demand, plus how foreign traders price Egypt's risk.", "نفس العرض والطلب على الدولار، وكمان نظرة المستثمرين الأجانب لمخاطر مصر."]
    up: ["If it rises above the official rate, foreigners expect the pound to weaken.", "لو طلع فوق السعر الرسمي يبقى الأجانب متوقعين الجنيه يضعف."]
    down: ["Close to or below the official rate means no hidden pressure.", "لو قريب من الرسمي أو أقل يبقى مفيش ضغط مستخبي."]
    related: [fx_cbe_official, fx_market_gap_pct]
  fx_gold_implied:
    what: ["The dollar rate implied by local gold prices: Egyptian 21-karat gold price divided by the global gold price. Egyptians often buy gold to protect savings.", "سعر الدولار المحسوب من الدهب: سعر جرام عيار 21 في مصر مقسوم على سعر الدهب العالمي. المصريين بيشتروا دهب يحموا بيه فلوسهم."]
    drivers: ["Local gold demand, fear of devaluation and the global gold price.", "الطلب المحلي على الدهب، والخوف من تخفيض الجنيه، وسعر الدهب العالمي."]
    up: ["If it rises above the official rate, people are paying a premium to hold gold instead of pounds — a warning sign of expected devaluation.", "لو طلع فوق السعر الرسمي يبقى الناس بتدفع زيادة عشان تمسك دهب بدل الجنيه، ودي علامة إنهم متوقعين تخفيض."]
    down: ["Back near the official rate means the market trusts the official price.", "لو رجع قريب من الرسمي يبقى السوق مصدق السعر الرسمي."]
    related: [gold_eg_21k, xauusd_spot, fx_cbe_official]
  gold_gap_pct:
    basis: level
    pivot: 0
    what: ["Gap between the gold-implied dollar rate and the official rate, in %. Within about ±0.8% is normal noise.", "الفرق بين دولار الدهب والدولار الرسمي بالنسبة المئوية. أي فرق جوه حدود 0.8% يعتبر عادي."]
    drivers: ["Devaluation fears, local gold demand around holidays and weddings, and sudden moves in global gold.", "الخوف من التخفيض، والطلب على الدهب في المواسم والأفراح، وحركة الدهب العالمي المفاجئة."]
    up: ["Above +3% for several days: people hedge against a weaker pound; above +5% is an alert.", "لو فوق 3% كذا يوم يبقى الناس بتتحوط من ضعف الجنيه، وفوق 5% إنذار."]
    down: ["Below zero (a discount): local dollar demand is easing.", "لو تحت الصفر يبقى الطلب على الدولار جوه البلد بيهدى."]
    related: [fx_gold_implied, gold_eg_21k, xauusd_spot]
  fx_market_gap_pct:
    basis: level
    pivot: 0
    what: ["Difference between the market (Yahoo) rate and the CBE official rate, in %.", "الفرق بين سعر السوق العالمي والسعر الرسمي بالنسبة المئوية."]
    drivers: ["Timing differences and how foreign traders see the pound.", "فرق التوقيت ونظرة المتعاملين الأجانب للجنيه."]
    up: ["A persistent positive gap hints at expected depreciation.", "لو الفرق موجب ومستمر يبقى فيه توقع لضعف الجنيه."]
    down: ["Near zero is normal.", "قريب من الصفر يعتبر طبيعي."]
    related: [fx_market, fx_cbe_official]
  fx_vol_20d:
    what: ["How much the official rate has been jumping around over the last 20 business days (annualized volatility).", "قد إيه السعر الرسمي بيتهز في آخر 20 يوم عمل."]
    drivers: ["Bursts of dollar demand, CBE interventions, shocks such as wars or rating changes.", "موجات طلب على الدولار، وتدخل البنك المركزي، وصدمات زي الحروب أو تغيير التصنيف."]
    up: ["Higher volatility scares foreign investors and raises hedging costs for importers.", "التذبذب العالي بيخوف المستثمر الأجنبي وبيغلي التحوط على المستوردين."]
    down: ["A calm rate supports confidence and planning.", "السعر الهادي بيدي ثقة وبيسهل التخطيط."]
    related: [fx_cbe_official, vix]
  carry_ex_post_3m:
    basis: level
    pivot: 0
    what: ["What a foreign investor actually earned over the last 3 months by holding 3-month T-bills, after the pound's move (in %).", "اللي المستثمر الأجنبي كسبه فعلا في آخر 3 شهور من أذون الخزانة بعد حساب حركة الجنيه."]
    drivers: ["T-bill yields minus the pound's depreciation.", "عائد الأذون ناقص نسبة ضعف الجنيه."]
    up: ["Positive and high: carry trade pays, so more hot money may come in and support the pound.", "لو عالي يبقى المراجحة مربحة، وممكن تدخل أموال ساخنة تدعم الجنيه."]
    down: ["Negative: the pound fell more than the interest earned — foreigners may leave.", "لو سالب يبقى الجنيه خسر أكتر من الفايدة، والأجانب ممكن يخرجوا."]
    related: [tbill_3m_yield, fx_chg_3m]
  carry_ex_ante:
    basis: level
    pivot: 0
    what: ["Expected carry: 1-year T-bill yield minus the depreciation hinted at by the gold gap.", "العائد المتوقع: فايدة أذون سنة ناقص التخفيض اللي بيلمح ليه فرق الدهب."]
    drivers: ["T-bill yields and devaluation expectations.", "عوايد الأذون وتوقعات التخفيض."]
    up: ["More attractive for foreign investors.", "جذاب أكتر للمستثمر الأجنبي."]
    down: ["Less attractive; hot-money inflows may slow.", "جاذبيته أقل، والأموال الساخنة ممكن تبطأ."]
    related: [tbill_12m_yield, gold_gap_pct]
  egx30:
    what: ["Price index of Egypt's 30 largest listed companies (EGX30), in points.", "مؤشر أسعار أكبر 30 شركة في البورصة المصرية بالنقاط."]
    drivers: ["Company profits, interest rates, foreign and Gulf buying, and fear of devaluation (Egyptians buy shares to protect savings from a weaker pound).", "أرباح الشركات، والفايدة، وشراء الأجانب والعرب، والخوف من تخفيض الجنيه لأن المصريين بيشتروا أسهم يحموا بيها فلوسهم."]
    up: ["Rising stocks usually signal confidence and inflows — but a rally in pounds can also mean people are hedging against devaluation. Check it against the dollar rate.", "الصعود عادة معناه ثقة وأموال داخلة، لكن ساعات بيكون تحوط من تخفيض الجنيه، فلازم نقارنه بسعر الدولار."]
    down: ["Falling stocks can reflect foreign selling, higher rates or worries about growth.", "النزول ممكن يكون بيع أجانب أو فايدة أعلى أو قلق على النمو."]
    related: [fx_cbe_official, egx_foreign_net, cbe_odr, msci_em_proxy]
  egx70:
    what: ["Equal-weighted index of 70 small and mid-sized listed companies (EGX70 EWI).", "مؤشر 70 شركة صغيرة ومتوسطة في البورصة بأوزان متساوية."]
    drivers: ["Mostly local retail investors; very sensitive to liquidity and sentiment.", "أغلبه مستثمرين أفراد مصريين، وبيتأثر جامد بالسيولة والمزاج العام."]
    up: ["Local risk appetite is strong (sometimes speculative).", "الإقبال المحلي على المخاطرة عالي، وساعات بيكون مضاربة."]
    down: ["Local investors are cautious or short of cash.", "المستثمر المحلي حذر أو مفيش سيولة."]
    related: [egx30, interbank_overnight]
  egx_foreign_net:
    basis: level
    pivot: 0
    what: ["Net buying (+) or selling (−) of Egyptian shares by foreign investors in a session.", "صافي شراء أو بيع الأجانب للأسهم المصرية في الجلسة."]
    drivers: ["Global risk mood, Egypt's rate outlook and devaluation fears.", "مزاج الأسواق العالمية، وتوقعات الفايدة في مصر، والخوف من التخفيض."]
    up: ["Foreign buying brings dollars in.", "شراء الأجانب بيدخل دولارات."]
    down: ["Several days of foreign selling is a hot-money exit signal.", "بيع الأجانب كذا يوم ورا بعض علامة خروج أموال ساخنة."]
    related: [egx30, vix]
  fx_parallel:
    what: ["Dollar price outside banks (black/parallel market), entered manually from press reports.", "سعر الدولار برة البنوك (السوق الموازية)، بيتدخل يدوي من الأخبار."]
    drivers: ["Dollar shortages in banks.", "نقص الدولار في البنوك."]
    up: ["A big gap over the official rate (>5%) has preceded devaluations in Egypt.", "الفرق الكبير عن الرسمي فوق 5% كان بيسبق التخفيض في مصر."]
    down: ["A small or no gap means banks are meeting demand.", "الفرق الصغير معناه البنوك بتلبي الطلب."]
    related: [fx_cbe_official, nir]
  eurobond_yield:
    what: ["Interest rate investors demand to hold Egypt's dollar bonds.", "الفايدة اللي المستثمرين بيطلبوها عشان يمسكوا سندات مصر بالدولار."]
    drivers: ["Egypt's credit risk plus US Treasury yields.", "مخاطر مصر الائتمانية زائد عوايد السندات الأمريكية."]
    up: ["Borrowing abroad gets more expensive; a sign of stress.", "الاقتراض من برة بيغلى، ودي علامة ضغط."]
    down: ["Cheaper borrowing and more confidence.", "الاقتراض أرخص والثقة أعلى."]
    related: [us10y, cds_5y, em_spread_proxy]
  cds_5y:
    what: ["Price of insurance against Egypt defaulting over 5 years, in basis points.", "تمن التأمين ضد إن مصر متدفعش ديونها لخمس سنين، بالنقاط الأساسية."]
    drivers: ["Reserves, IMF support, ratings and regional risk.", "الاحتياطي ودعم صندوق النقد والتصنيف ومخاطر المنطقة."]
    up: ["Markets see more risk; rating downgrades often follow.", "السوق شايف مخاطر أكتر، وغالبا بيجي بعدها خفض تصنيف."]
    down: ["Markets see less risk.", "السوق شايف مخاطر أقل."]
    related: [eurobond_yield, nir]

  cbe_odr:
    what: ["The Central Bank's overnight deposit rate — the floor of Egypt's interest-rate corridor and the main policy rate.", "فايدة الإيداع لليلة واحدة في البنك المركزي، وهي الفايدة الأساسية في مصر."]
    drivers: ["Set by the Monetary Policy Committee about 8 times a year, mainly to fight inflation and keep the pound attractive.", "بتحددها لجنة السياسة النقدية حوالي 8 مرات في السنة، عشان تحارب التضخم وتخلي الجنيه جذاب."]
    up: ["A hike fights inflation and attracts foreign money, but makes loans and government debt more expensive.", "الرفع بيحارب التضخم وبيجذب الأموال الأجنبية، بس بيغلي القروض وديون الحكومة."]
    down: ["A cut helps growth and the budget, but can push money out if real rates get too low.", "التخفيض بيساعد النمو والموازنة، بس ممكن يطلع الفلوس لو الفايدة الحقيقية قلت قوي."]
    related: [cpi_urban_yoy, cpi_core_yoy, real_headline, cbe_mpc_tone]
  cbe_olr:
    what: ["Overnight lending rate — the ceiling of the corridor (what banks pay to borrow from the CBE).", "فايدة الإقراض لليلة واحدة، وهي السقف اللي البنوك بتستلف بيه من البنك المركزي."]
    drivers: ["Moves with the deposit rate at MPC meetings.", "بتتحرك مع فايدة الإيداع في اجتماعات اللجنة."]
    up: ["Tighter money.", "تشديد."]
    down: ["Easier money.", "تيسير."]
    related: [cbe_odr]
  cbe_mainop:
    what: ["Rate of the CBE's main operation (mid-corridor).", "سعر العملية الرئيسية للبنك المركزي في نص الممر."]
    drivers: ["MPC decisions.", "قرارات لجنة السياسة النقدية."]
    up: ["Tighter money.", "تشديد."]
    down: ["Easier money.", "تيسير."]
    related: [cbe_odr]
  cbe_discount:
    what: ["The CBE discount rate.", "سعر الائتمان والخصم في البنك المركزي."]
    drivers: ["MPC decisions.", "قرارات لجنة السياسة النقدية."]
    up: ["Tighter money.", "تشديد."]
    down: ["Easier money.", "تيسير."]
    related: [cbe_odr]
  interbank_overnight:
    what: ["CONIA — the average rate banks charge each other overnight.", "متوسط الفايدة اللي البنوك بتسلف بيها بعض لليلة واحدة."]
    drivers: ["The policy corridor and how much cash banks have.", "ممر الفايدة وقد إيه البنوك معاها سيولة."]
    up: ["Tighter liquidity in banks.", "السيولة في البنوك أقل."]
    down: ["Plenty of liquidity.", "السيولة كتير."]
    related: [cbe_odr, cbe_olr]
  cbe_mpc_tone:
    what: ["A simple word count of hawkish (tighter) minus dovish (easier) words in the latest MPC statement. Tool heuristic.", "عد بسيط للكلمات المتشددة ناقص الكلمات الميالة للتيسير في آخر بيان للجنة. تقدير من الأداة."]
    drivers: ["The CBE's view of inflation risks.", "نظرة البنك المركزي لمخاطر التضخم."]
    up: ["More hawkish: cuts less likely soon.", "أكتر تشدد: التخفيض مش قريب."]
    down: ["More dovish: rate cuts more likely.", "أكتر ميل للتيسير: التخفيض وارد."]
    related: [cbe_odr, cpi_core_yoy]
  real_headline:
    what: ["Real interest rate: the deposit rate minus urban inflation. It's what savers and foreign investors truly earn.", "الفايدة الحقيقية: فايدة الإيداع ناقص التضخم. ده اللي المدخر والمستثمر بيكسبه بجد."]
    drivers: ["CBE rate decisions and the monthly inflation print.", "قرارات الفايدة وأرقام التضخم الشهرية."]
    up: ["Higher real rates attract foreign 'carry' money and support the pound, but slow borrowing and growth.", "الفايدة الحقيقية العالية بتجذب الأموال الأجنبية وبتدعم الجنيه، بس بتبطأ الاقتراض والنمو."]
    down: ["Low or negative real rates make holding pounds unattractive — money moves to dollars, gold or property.", "لما تقل أو تبقى سالبة، محدش عايز يمسك جنيه والفلوس بتروح للدولار والدهب والعقارات."]
    related: [cbe_odr, cpi_urban_yoy]
  real_core:
    what: ["Deposit rate minus core inflation (inflation without volatile food and administered prices).", "فايدة الإيداع ناقص التضخم الأساسي اللي من غير الأكل الطازة والأسعار المحددة إداريا."]
    drivers: ["CBE rate and core inflation.", "الفايدة والتضخم الأساسي."]
    up: ["Tighter real policy; supportive for the pound.", "سياسة أشد وده دعم للجنيه."]
    down: ["Looser real policy.", "سياسة أخف."]
    related: [cbe_odr, cpi_core_yoy]
  real_expected:
    what: ["Deposit rate minus the CBE's own forecast of inflation — a forward-looking real rate.", "فايدة الإيداع ناقص توقع البنك المركزي للتضخم، يعني الفايدة الحقيقية المتوقعة."]
    drivers: ["CBE rate and its inflation forecast.", "الفايدة وتوقع التضخم."]
    up: ["Policy is tight relative to where inflation is heading.", "السياسة مشددة مقارنة باتجاه التضخم."]
    down: ["Little cushion if inflation rises again.", "مفيش مساحة أمان لو التضخم رجع يزيد."]
    related: [cbe_odr, infl_expectations]
  real_ceiling:
    what: ["Corridor ceiling (lending rate) minus urban inflation.", "سقف الممر ناقص التضخم."]
    drivers: ["CBE rates and inflation.", "الفايدة والتضخم."]
    up: ["Tighter.", "أشد."]
    down: ["Looser.", "أخف."]
    related: [cbe_olr, cpi_urban_yoy]
  nir:
    what: ["Net international reserves: dollars, gold and SDRs held by the Central Bank — Egypt's emergency savings.", "صافي الاحتياطيات الدولية: الدولارات والدهب وحقوق السحب اللي في إيد البنك المركزي، وهي مدخرات الطوارئ لمصر."]
    drivers: ["Inflows (IMF and Gulf money, bond sales, FDI) minus debt payments and CBE support for the pound; gold price changes also revalue the gold part.", "اللي بيدخل من صندوق النقد والخليج والسندات والاستثمار ناقص سداد الديون ودعم الجنيه، وكمان سعر الدهب بيغير قيمة جزء الدهب."]
    up: ["Bigger buffer against shocks — supports confidence in the pound. Check whether the rise came from gold prices or new money.", "سند أكبر ضد الصدمات وبيدعم الثقة في الجنيه. لكن شوف الزيادة جاية من سعر الدهب ولا فلوس جديدة."]
    down: ["Falling reserves while the official rate stays flat can mean the CBE is defending the pound (a hidden peg).", "لو الاحتياطي بيقل والسعر الرسمي ثابت، ممكن البنك المركزي بيسند الجنيه."]
    related: [nir_gold, xauusd, fx_cbe_official, remittances]
  nir_chg_3m:
    basis: level
    pivot: 0
    what: ["Change in reserves over the last 3 months (USD mn).", "تغير الاحتياطي في آخر 3 شهور بالمليون دولار."]
    drivers: ["Same as reserves.", "نفس محركات الاحتياطي."]
    up: ["Building buffers.", "بنبني سند."]
    down: ["Using reserves — watch for a defended rate.", "بنصرف من الاحتياطي، فخلي بالك لو السعر متسند."]
    related: [nir, fx_cbe_official]
  nir_months_imports:
    basis: level
    pivot: 5
    what: ["How many months of goods imports the reserves could pay for. Below about 3–5 months is considered thin.", "الاحتياطي يكفي كام شهر استيراد. أقل من تلات لخمس شهور يعتبر قليل."]
    drivers: ["Reserves and the yearly import bill.", "الاحتياطي وفاتورة الاستيراد السنوية."]
    up: ["Stronger buffer.", "سند أقوى."]
    down: ["Thinner buffer; more vulnerable to shocks.", "سند أضعف ومعرضين للصدمات أكتر."]
    related: [nir, imports_oil_fy, imports_nonoil_fy]
  nir_gold:
    what: ["Value of the CBE's gold holdings (USD mn).", "قيمة الدهب اللي عند البنك المركزي بالمليون دولار."]
    drivers: ["Mostly the world gold price.", "غالبا سعر الدهب العالمي."]
    up: ["Reserves look bigger, but it's revaluation, not new dollars.", "الاحتياطي بيبان أكبر لكن ده فرق تقييم مش دولارات جديدة."]
    down: ["Reserves look smaller from gold price falls.", "الاحتياطي بيبان أقل بسبب نزول الدهب."]
    related: [xauusd, nir]

  cpi_urban_yoy:
    what: ["Headline inflation in Egyptian cities: how much prices rose compared with the same month last year (CAPMAS, published by the CBE).", "التضخم في المدن: الأسعار زادت قد إيه مقارنة بنفس الشهر السنة اللي فاتت."]
    drivers: ["The pound's past moves (imported prices), fuel and electricity price decisions, food prices and interest rates.", "حركة الجنيه اللي فاتت، وقرارات أسعار البنزين والكهربا، وأسعار الأكل، والفايدة."]
    up: ["Rising inflation erodes salaries and savings and pressures the CBE to keep rates high.", "التضخم لما يزيد بياكل المرتبات والمدخرات، وبيضغط على البنك المركزي يسيب الفايدة عالية."]
