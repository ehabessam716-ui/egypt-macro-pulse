recurring:
  # day = typical day of month; business = n-th business day; weekday = weekly
  - {kind: cpi, series_id: cpi_urban_yoy, rule: {monthday: 10}, time: "11:00", description: "CAPMAS urban CPI release (expected around the 10th; typical pattern)", source_url: "https://www.capmas.gov.eg/"}
  - {kind: core_cpi, series_id: cpi_core_yoy, rule: {monthday: 11}, time: "11:00", description: "CBE core CPI / CPI press release (expected same or next day)", source_url: "https://www.cbe.org.eg/en/economic-research/statistics/inflation-rates"}
  - {kind: pmi, series_id: pmi, rule: {business_day: 3, calendar: global}, time: "07:15", description: "S&P Global Egypt PMI (expected ~3rd business day, 07:15 Cairo)", source_url: "https://www.pmi.spglobal.com/Public/Release/PressReleases"}
  - {kind: nir, series_id: nir, rule: {monthday: 7}, time: "10:00", description: "CBE net international reserves (expected ~5th–8th)", source_url: "https://www.cbe.org.eg/en/news-publications/news"}
  - {kind: gpr, series_id: gpr_global, rule: {monthday: 1}, description: "GPR monthly file update (~1st of month)", source_url: "https://www.matteoiacoviello.com/gpr.htm"}
