# Egypt Macro Pulse — indicator catalog (SPEC §3)
# access: FREE_API / FREE_FILE / SCRAPE / MANUAL / PAID / DERIVED
# frequency: daily / weekly / monthly / quarterly / fiscal_year (Egypt FY Jul–Jun) / annual / per_auction / event
# obs_date convention: daily = the day; monthly = 1st of month; quarterly = 1st day of quarter;
#   fiscal_year = 1 July of the FY start year; annual = 1 January.
# stale_after_days: daily = Cairo/global BUSINESS days since obs_date; others = calendar days since period end.
# step: true = a regime value (policy rate, pump price) that stays in force until changed.

defaults:
  stale_after_days: {daily: 3, weekly: 10, monthly: 45, quarterly: 120, fiscal_year: 450, annual: 450, per_auction: 21, event: 100000}

series:
  # ---------------------------------------------------------------- 3.1 FX & markets
  - {id: fx_cbe_official, name_en: "USD/EGP CBE official (buy)", name_ar: "سعر الدولار الرسمي في البنك المركزي (شراء)", domain: fx, frequency: daily, unit: EGP per USD, source: cbe_fx_rates, access: SCRAPE, calendar: egypt, fallback: fx_market, definition_note: "CBE average market rate, buy side, published Sun–Thu"}
  - {id: fx_cbe_official_sell, name_en: "USD/EGP CBE official (sell)", name_ar: "سعر الدولار الرسمي في البنك المركزي (بيع)", domain: fx, frequency: daily, unit: EGP per USD, source: cbe_fx_rates, access: SCRAPE, calendar: egypt}
  - {id: fx_market, name_en: "USD/EGP market close (Yahoo, unofficial)", name_ar: "سعر الدولار في السوق العالمي (غير رسمي)", domain: fx, frequency: daily, unit: EGP per USD, source: yahoo_markets, endpoint: "EGP=X", access: FREE_API, calendar: all}
  - {id: fx_parallel, name_en: "USD/EGP parallel market", name_ar: "سعر الدولار في السوق الموازية", domain: fx, frequency: event, unit: EGP per USD, source: manual, access: MANUAL}
  - {id: egx_foreign_net, name_en: "EGX foreigners' net buy/sell", name_ar: "صافي تعاملات الأجانب في البورصة", domain: fx, frequency: daily, unit: EGP mn, source: egx, access: MANUAL, calendar: egypt, definition_note: "EGX site resets scripted connections; MANUAL"}
  - {id: foreign_tbills_holdings, name_en: "Non-resident holdings of T-bills", name_ar: "حيازة الأجانب لأذون الخزانة", domain: fx, frequency: monthly, unit: USD bn, source: manual, access: MANUAL}
  - {id: tbill_3m_yield, name_en: "T-bill 91-day weighted avg yield", name_ar: "عائد أذون الخزانة لأجل 3 شهور", domain: fx, frequency: per_auction, unit: "%", source: cbe_auctions, access: SCRAPE, definition_note: "obs_date = issue date of the auction"}
  - {id: tbill_6m_yield, name_en: "T-bill 182-day weighted avg yield", name_ar: "عائد أذون الخزانة لأجل 6 شهور", domain: fx, frequency: per_auction, unit: "%", source: cbe_auctions, access: SCRAPE}
  - {id: tbill_9m_yield, name_en: "T-bill 273-day weighted avg yield", name_ar: "عائد أذون الخزانة لأجل 9 شهور", domain: fx, frequency: per_auction, unit: "%", source: cbe_auctions, access: SCRAPE}
  - {id: tbill_12m_yield, name_en: "T-bill 1-year (357/364-day) weighted avg yield", name_ar: "عائد أذون الخزانة لأجل سنة", domain: fx, frequency: per_auction, unit: "%", source: cbe_auctions, access: SCRAPE}
  - {id: tbill_3m_btc, name_en: "T-bill 91-day bid-to-cover", name_ar: "نسبة التغطية لأذون 3 شهور", domain: fx, frequency: per_auction, unit: ratio, source: cbe_auctions, access: SCRAPE, definition_note: "submitted / required (offered) amount"}
  - {id: tbill_6m_btc, name_en: "T-bill 182-day bid-to-cover", name_ar: "نسبة التغطية لأذون 6 شهور", domain: fx, frequency: per_auction, unit: ratio, source: cbe_auctions, access: SCRAPE}
  - {id: tbill_9m_btc, name_en: "T-bill 273-day bid-to-cover", name_ar: "نسبة التغطية لأذون 9 شهور", domain: fx, frequency: per_auction, unit: ratio, source: cbe_auctions, access: SCRAPE}
  - {id: tbill_12m_btc, name_en: "T-bill 1-year bid-to-cover", name_ar: "نسبة التغطية لأذون سنة", domain: fx, frequency: per_auction, unit: ratio, source: cbe_auctions, access: SCRAPE}
  - {id: tbill_3m_accepted_ratio, name_en: "T-bill 91-day accepted / offered", name_ar: "المقبول إلى المطلوب لأذون 3 شهور", domain: fx, frequency: per_auction, unit: ratio, source: cbe_auctions, access: SCRAPE}
  - {id: tbill_6m_accepted_ratio, name_en: "T-bill 182-day accepted / offered", name_ar: "المقبول إلى المطلوب لأذون 6 شهور", domain: fx, frequency: per_auction, unit: ratio, source: cbe_auctions, access: SCRAPE}
  - {id: tbill_9m_accepted_ratio, name_en: "T-bill 273-day accepted / offered", name_ar: "المقبول إلى المطلوب لأذون 9 شهور", domain: fx, frequency: per_auction, unit: ratio, source: cbe_auctions, access: SCRAPE}
  - {id: tbill_12m_accepted_ratio, name_en: "T-bill 1-year accepted / offered", name_ar: "المقبول إلى المطلوب لأذون سنة", domain: fx, frequency: per_auction, unit: ratio, source: cbe_auctions, access: SCRAPE}
  - {id: eurobond_yield, name_en: "Egypt USD Eurobond yield (key maturity)", name_ar: "عائد سندات مصر الدولارية", domain: fx, frequency: daily, unit: "%", source: manual, access: MANUAL}
  - {id: cds_5y, name_en: "Egypt 5Y CDS", name_ar: "تكلفة التأمين على ديون مصر لخمس سنين", domain: fx, frequency: daily, unit: bp, source: manual, access: PAID, definition_note: "Bloomberg/Refinitiv only; MANUAL weekly from press"}

  # ---------------------------------------------------------------- 3.2 Monetary
  - {id: cbe_odr, name_en: "CBE overnight deposit rate", name_ar: "سعر عائد الإيداع لليلة واحدة", domain: monetary, frequency: event, unit: "%", source: cbe_mpc, access: SCRAPE, step: true}
  - {id: cbe_olr, name_en: "CBE overnight lending rate", name_ar: "سعر عائد الإقراض لليلة واحدة", domain: monetary, frequency: event, unit: "%", source: cbe_mpc, access: SCRAPE, step: true}
  - {id: cbe_mainop, name_en: "CBE main operation rate", name_ar: "سعر العملية الرئيسية", domain: monetary, frequency: event, unit: "%", source: cbe_mpc, access: SCRAPE, step: true}
  - {id: cbe_discount, name_en: "CBE discount rate", name_ar: "سعر الائتمان والخصم", domain: monetary, frequency: event, unit: "%", source: cbe_mpc, access: SCRAPE, step: true}
  - {id: cbe_mpc_decision, name_en: "MPC decision (-1 cut, 0 hold, +1 hike)", name_ar: "قرار لجنة السياسة النقدية", domain: monetary, frequency: event, unit: code, source: cbe_news, access: SCRAPE}
  - {id: cbe_mpc_tone, name_en: "MPC statement tone (hawkish minus dovish words per 1000)", name_ar: "نبرة بيان لجنة السياسة النقدية", domain: monetary, frequency: event, unit: score, source: cbe_news, access: SCRAPE, definition_note: "tool word-count heuristic on the statement text"}
  - {id: interbank_overnight, name_en: "Cairo overnight index average (CONIA)", name_ar: "متوسط سعر الإقراض بين البنوك لليلة", domain: monetary, frequency: daily, unit: "%", source: cbe_home, access: SCRAPE, calendar: egypt, definition_note: "value shown on the CBE homepage, dated by the homepage FX date"}
  - {id: m2, name_en: "Broad money M2 (y/y)", name_ar: "نمو السيولة المحلية", domain: monetary, frequency: monthly, unit: "%", source: manual, access: MANUAL}
  - {id: credit_private, name_en: "Bank credit to private sector (y/y)", name_ar: "نمو الائتمان للقطاع الخاص", domain: monetary, frequency: monthly, unit: "%", source: manual, access: MANUAL}
  - {id: credit_gov, name_en: "Bank credit to government (y/y)", name_ar: "نمو الائتمان للحكومة", domain: monetary, frequency: monthly, unit: "%", source: manual, access: MANUAL}
  - {id: nfa_banks, name_en: "Net foreign assets — banking system", name_ar: "صافي الأصول الأجنبية للجهاز المصرفي", domain: monetary, frequency: monthly, unit: USD bn, source: manual, access: MANUAL}
  - {id: nfa_cbe, name_en: "Net foreign assets — CBE", name_ar: "صافي الأصول الأجنبية للبنك المركزي", domain: monetary, frequency: monthly, unit: USD bn, source: manual, access: MANUAL}
  - {id: nir, name_en: "Net international reserves", name_ar: "صافي الاحتياطيات الدولية", domain: monetary, frequency: monthly, unit: USD mn, source: cbe_news, access: SCRAPE, release_lag_days: 7, stale_after_days: 45, definition_note: "end-of-month stock; CBE news headline (provisional)"}
  - {id: nir_gold, name_en: "NIR — gold", name_ar: "الاحتياطي — ذهب", domain: monetary, frequency: monthly, unit: USD mn, source: manual, access: MANUAL}
  - {id: nir_fx, name_en: "NIR — foreign currencies", name_ar: "الاحتياطي — عملات أجنبية", domain: monetary, frequency: monthly, unit: USD mn, source: manual, access: MANUAL}
  - {id: nir_sdr, name_en: "NIR — SDR", name_ar: "الاحتياطي — حقوق السحب الخاصة", domain: monetary, frequency: monthly, unit: USD mn, source: manual, access: MANUAL}

  # ---------------------------------------------------------------- 3.3 Inflation
  - {id: cpi_urban_yoy, name_en: "Urban headline CPI (y/y)", name_ar: "التضخم السنوي في المدن", domain: inflation, frequency: monthly, unit: "%", source: cbe_cpi, access: SCRAPE, release_lag_days: 10, stale_after_days: 45}
  - {id: cpi_urban_mom, name_en: "Urban headline CPI (m/m)", name_ar: "التضخم الشهري في المدن", domain: inflation, frequency: monthly, unit: "%", source: cbe_cpi, access: SCRAPE, release_lag_days: 10}
  - {id: cpi_core_yoy, name_en: "Core CPI (y/y)", name_ar: "التضخم الأساسي السنوي", domain: inflation, frequency: monthly, unit: "%", source: cbe_cpi, access: SCRAPE, release_lag_days: 11}
  - {id: cpi_core_mom, name_en: "Core CPI (m/m)", name_ar: "التضخم الأساسي الشهري", domain: inflation, frequency: monthly, unit: "%", source: cbe_cpi, access: SCRAPE, release_lag_days: 11}
  - {id: cpi_regulated_yoy, name_en: "Regulated items CPI (y/y)", name_ar: "تضخم السلع المسعرة إداريا (سنوي)", domain: inflation, frequency: monthly, unit: "%", source: cbe_cpi, access: SCRAPE}
  - {id: cpi_regulated_mom, name_en: "Regulated items CPI (m/m)", name_ar: "تضخم السلع المسعرة إداريا (شهري)", domain: inflation, frequency: monthly, unit: "%", source: cbe_cpi, access: SCRAPE}
  - {id: cpi_fv_yoy, name_en: "Fruits & vegetables CPI (y/y)", name_ar: "تضخم الخضار والفاكهة (سنوي)", domain: inflation, frequency: monthly, unit: "%", source: cbe_cpi, access: SCRAPE}
  - {id: cpi_fv_mom, name_en: "Fruits & vegetables CPI (m/m)", name_ar: "تضخم الخضار والفاكهة (شهري)", domain: inflation, frequency: monthly, unit: "%", source: cbe_cpi, access: SCRAPE}
  - {id: cpi_national_yoy, name_en: "Nationwide CPI (y/y)", name_ar: "التضخم السنوي على مستوى الجمهورية", domain: inflation, frequency: monthly, unit: "%", source: capmas, access: MANUAL, definition_note: "CAPMAS site is a JS-only app; MANUAL"}
  - {id: cpi_food_yoy, name_en: "Food & non-alcoholic beverages CPI (y/y)", name_ar: "تضخم الطعام والمشروبات", domain: inflation, frequency: monthly, unit: "%", source: capmas, access: MANUAL}
  - {id: cpi_food_mom, name_en: "Food CPI (m/m)", name_ar: "تضخم الطعام الشهري", domain: inflation, frequency: monthly, unit: "%", source: capmas, access: MANUAL}
  - {id: infl_expectations, name_en: "CBE projected average inflation (next FY)", name_ar: "توقعات البنك المركزي لمتوسط التضخم", domain: inflation, frequency: event, unit: "%", source: manual, access: MANUAL, step: true}
  - {id: infl_target, name_en: "CBE inflation target (midpoint)", name_ar: "مستهدف التضخم للبنك المركزي", domain: inflation, frequency: event, unit: "%", source: manual, access: MANUAL, step: true}

  # ---------------------------------------------------------------- 3.4 External sector
  - {id: remittances, name_en: "Remittances (monthly)", name_ar: "تحويلات المصريين بالخارج (شهري)", domain: external, frequency: monthly, unit: USD bn, source: cbe_news, access: SCRAPE, release_lag_days: 45, stale_after_days: 80}
  - {id: remittances_yoy, name_en: "Remittances y/y (monthly)", name_ar: "نمو التحويلات السنوي", domain: external, frequency: monthly, unit: "%", source: cbe_news, access: SCRAPE, stale_after_days: 80}
  - {id: remittances_ytd, name_en: "Remittances calendar-year-to-date", name_ar: "التحويلات منذ أول السنة", domain: external, frequency: monthly, unit: USD bn, source: cbe_news, access: SCRAPE, stale_after_days: 80, definition_note: "January to the stated month"}
  - {id: remittances_fy, name_en: "Remittances (fiscal year, BoP)", name_ar: "التحويلات في السنة المالية", domain: external, frequency: fiscal_year, unit: USD bn, source: cbe_bop, access: SCRAPE}
  - {id: bop_ca_fy, name_en: "Current account balance (FY)", name_ar: "رصيد الحساب الجاري (سنة مالية)", domain: external, frequency: fiscal_year, unit: USD bn, source: cbe_bop, access: SCRAPE, definition_note: "negative = deficit"}
  - {id: bop_overall_fy, name_en: "Overall BoP balance (FY)", name_ar: "الميزان الكلي للمدفوعات", domain: external, frequency: fiscal_year, unit: USD bn, source: cbe_bop, access: SCRAPE}
  - {id: capital_financial_net_fy, name_en: "Capital & financial account net inflow (FY)", name_ar: "صافي تدفقات الحساب الرأسمالي والمالي", domain: external, frequency: fiscal_year, unit: USD bn, source: cbe_bop, access: SCRAPE}
  - {id: trade_balance_fy, name_en: "Merchandise trade balance (FY)", name_ar: "الميزان التجاري السلعي", domain: external, frequency: fiscal_year, unit: USD bn, source: cbe_bop, access: SCRAPE, definition_note: "negative = deficit"}
  - {id: trade_nonoil_balance_fy, name_en: "Non-oil trade balance (FY)", name_ar: "الميزان التجاري غير البترولي", domain: external, frequency: fiscal_year, unit: USD bn, source: cbe_bop, access: SCRAPE}
  - {id: trade_oil_balance_fy, name_en: "Oil trade balance (FY)", name_ar: "الميزان التجاري البترولي", domain: external, frequency: fiscal_year, unit: USD bn, source: cbe_bop, access: SCRAPE}
  - {id: imports_nonoil_fy, name_en: "Non-oil imports (FY)", name_ar: "الواردات غير البترولية", domain: external, frequency: fiscal_year, unit: USD bn, source: cbe_bop, access: SCRAPE}
  - {id: imports_oil_fy, name_en: "Oil imports (FY)", name_ar: "الواردات البترولية", domain: external, frequency: fiscal_year, unit: USD bn, source: cbe_bop, access: SCRAPE}
  - {id: exports_nonoil_fy, name_en: "Non-oil exports (FY)", name_ar: "الصادرات غير البترولية", domain: external, frequency: fiscal_year, unit: USD bn, source: cbe_bop, access: SCRAPE}
  - {id: exports_oil_fy, name_en: "Oil exports (FY)", name_ar: "الصادرات البترولية", domain: external, frequency: fiscal_year, unit: USD bn, source: cbe_bop, access: SCRAPE}
  - {id: invest_income_balance_fy, name_en: "Investment income balance (FY)", name_ar: "صافي دخل الاستثمار", domain: external, frequency: fiscal_year, unit: USD bn, source: cbe_bop, access: SCRAPE, definition_note: "negative = net payments abroad"}
  - {id: services_surplus_fy, name_en: "Services surplus (FY)", name_ar: "فائض الخدمات", domain: external, frequency: fiscal_year, unit: USD bn, source: cbe_bop, access: SCRAPE}
  - {id: tourism_receipts_fy, name_en: "Tourism revenues (FY, BoP)", name_ar: "إيرادات السياحة (سنة مالية)", domain: external, frequency: fiscal_year, unit: USD bn, source: cbe_bop, access: SCRAPE}
  - {id: suez_receipts_fy, name_en: "Suez Canal transit receipts (FY, BoP)", name_ar: "إيرادات المرور في قناة السويس (ميزان المدفوعات)", domain: external, frequency: fiscal_year, unit: USD bn, source: cbe_bop, access: SCRAPE, definition_note: "BoP definition; differs from SCA revenue"}
  - {id: fdi_net_fy, name_en: "Net FDI inflow (FY)", name_ar: "صافي الاستثمار الأجنبي المباشر", domain: external, frequency: fiscal_year, unit: USD bn, source: cbe_bop, access: SCRAPE}
  - {id: portfolio_net_fy, name_en: "Portfolio investment in Egypt, net (FY)", name_ar: "صافي استثمارات الحافظة", domain: external, frequency: fiscal_year, unit: USD bn, source: cbe_bop, access: SCRAPE}
  - {id: tourism_arrivals_ytd, name_en: "Tourist arrivals, calendar YTD", name_ar: "عدد السياح منذ أول السنة", domain: external, frequency: monthly, unit: mn, source: manual, access: MANUAL, stale_after_days: 120}
  - {id: tourism_receipts_ytd, name_en: "Tourism revenues, calendar YTD (IDSC)", name_ar: "إيرادات السياحة منذ أول السنة", domain: external, frequency: monthly, unit: USD bn, source: manual, access: MANUAL, stale_after_days: 120}
  - {id: suez_revenue_fy, name_en: "Suez Canal revenue (FY, SCA)", name_ar: "إيرادات قناة السويس (هيئة القناة)", domain: external, frequency: fiscal_year, unit: USD bn, source: manual, access: MANUAL}
  - {id: suez_transits, name_en: "Suez Canal daily transits", name_ar: "عدد السفن العابرة لقناة السويس يوميا", domain: external, frequency: daily, unit: vessels, source: portwatch_chokepoints, endpoint: chokepoint1, access: FREE_API, calendar: all, stale_after_days: 12, definition_note: "PortWatch n_total; updated weekly (Tuesdays)"}
  - {id: suez_capacity, name_en: "Suez Canal daily transit capacity", name_ar: "حمولة السفن العابرة لقناة السويس", domain: external, frequency: daily, unit: metric tons, source: portwatch_chokepoints, endpoint: chokepoint1, access: FREE_API, calendar: all, stale_after_days: 12}
  - {id: babelmandeb_transits, name_en: "Bab el-Mandeb daily transits", name_ar: "عدد السفن العابرة لباب المندب", domain: external, frequency: daily, unit: vessels, source: portwatch_chokepoints, endpoint: chokepoint4, access: FREE_API, calendar: all, stale_after_days: 12}
  - {id: babelmandeb_capacity, name_en: "Bab el-Mandeb daily capacity", name_ar: "حمولة السفن في باب المندب", domain: external, frequency: daily, unit: metric tons, source: portwatch_chokepoints, endpoint: chokepoint4, access: FREE_API, calendar: all, stale_after_days: 12}
  - {id: hormuz_transits, name_en: "Strait of Hormuz daily transits", name_ar: "عدد السفن العابرة لمضيق هرمز", domain: external, frequency: daily, unit: vessels, source: portwatch_chokepoints, endpoint: chokepoint6, access: FREE_API, calendar: all, stale_after_days: 12}
  - {id: hormuz_capacity, name_en: "Strait of Hormuz daily capacity", name_ar: "حمولة السفن في مضيق هرمز", domain: external, frequency: daily, unit: metric tons, source: portwatch_chokepoints, endpoint: chokepoint6, access: FREE_API, calendar: all, stale_after_days: 12}

  # ---------------------------------------------------------------- 3.5 Fiscal & debt
  - {id: ext_debt_stock, name_en: "External debt stock", name_ar: "رصيد الدين الخارجي", domain: fiscal, frequency: quarterly, unit: USD bn, source: manual, access: MANUAL, stale_after_days: 200}
  - {id: ext_debt_gdp, name_en: "External debt (% of GDP)", name_ar: "الدين الخارجي إلى الناتج", domain: fiscal, frequency: quarterly, unit: "% GDP", source: manual, access: MANUAL, stale_after_days: 200}
  - {id: ext_debt_short_term, name_en: "Short-term external debt", name_ar: "الدين الخارجي قصير الأجل", domain: fiscal, frequency: quarterly, unit: USD bn, source: manual, access: MANUAL}
  - {id: ext_debt_service_actual, name_en: "Actual external debt service", name_ar: "خدمة الدين الخارجي الفعلية", domain: fiscal, frequency: event, unit: USD bn, source: manual, access: MANUAL, definition_note: "period stated in obs_note (e.g. first 9 months of a FY)"}
  - {id: ext_debt_service_sched, name_en: "Projected MLT PPG external debt service (calendar year)", name_ar: "خدمة الدين الخارجي المتوقعة", domain: fiscal, frequency: annual, unit: USD bn, source: manual, access: MANUAL, stale_after_days: 100000, definition_note: "medium/long-term public & publicly guaranteed; calendar year"}
  - {id: budget_balance, name_en: "Overall budget balance (% GDP)", name_ar: "عجز الموازنة الكلي", domain: fiscal, frequency: fiscal_year, unit: "% GDP", source: manual, access: MANUAL}
  - {id: primary_balance, name_en: "Primary balance (% GDP)", name_ar: "الفائض الأولي", domain: fiscal, frequency: fiscal_year, unit: "% GDP", source: manual, access: MANUAL}
  - {id: gov_debt_gdp, name_en: "General government debt (% GDP)", name_ar: "الدين الحكومي إلى الناتج", domain: fiscal, frequency: fiscal_year, unit: "% GDP", source: manual, access: MANUAL}
  - {id: interest_to_revenue, name_en: "Interest payments / revenue", name_ar: "الفوايد إلى الإيرادات", domain: fiscal, frequency: fiscal_year, unit: "%", source: manual, access: MANUAL}
  - {id: budget_oil_assumption, name_en: "Budget oil price assumption", name_ar: "سعر البترول في الموازنة", domain: fiscal, frequency: event, unit: USD/bbl, source: manual, access: MANUAL, step: true}
  - {id: dom_debt_maturities, name_en: "T-bill maturity wall (next month)", name_ar: "أذون مستحقة الشهر الجاي", domain: fiscal, frequency: monthly, unit: EGP bn, source: manual, access: MANUAL}
  - {id: imf_weo_gdp, name_en: "IMF WEO real GDP growth (Egypt)", name_ar: "توقعات صندوق النقد لنمو الاقتصاد", domain: fiscal, frequency: annual, unit: "%", source: imf_datamapper, endpoint: NGDP_RPCH, access: FREE_API, stale_after_days: 100000, definition_note: "years after the latest actual are IMF projections"}
